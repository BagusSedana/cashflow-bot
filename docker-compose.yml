version: '3.8'

services:
  bot:
    build: .
    container_name: ai-telegram-bot
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    volumes:
      - bot-data:/app/data
    environment:
      - NODE_ENV=production
      - DATABASE_PATH=/app/data/bot.db

volumes:
  bot-data:
