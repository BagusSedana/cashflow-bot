<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tonton Iklan — CashFlow ID</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; height:100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--tg-theme-bg-color, #17212b); color: var(--tg-theme-text-color, #fff); }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:stretch; padding:24px 20px 40px; }
  h1 { font-size:22px; margin:0 0 6px; }
  .sub { color: var(--tg-theme-hint-color, #93a3b3); font-size:14px; margin-bottom:24px; }
  .balance-card { background: var(--tg-theme-secondary-bg-color, #232e3c); border-radius:14px; padding:18px 20px; margin-bottom:24px; }
  .balance-card .label { font-size:13px; color: var(--tg-theme-hint-color, #93a3b3); }
  .balance-card .value { font-size:30px; font-weight:700; margin-top:4px; }
  .meta { display:flex; justify-content:space-between; margin-top:10px; font-size:12px; color: var(--tg-theme-hint-color, #93a3b3); }
  button { -webkit-tap-highlight-color: transparent; cursor:pointer; border:0; font-family:inherit; }
  .primary { background: var(--tg-theme-button-color, #2ea6ff); color: var(--tg-theme-button-text-color, #fff); border-radius:12px; padding:18px 16px; font-size:17px; font-weight:600; width:100%; }
  .primary:disabled { opacity:.5; cursor:not-allowed; }
  .primary:active { transform: scale(.99); }
  .status { margin-top:18px; padding:14px 16px; border-radius:10px; font-size:14px; line-height:1.45; min-height:48px; background: var(--tg-theme-secondary-bg-color, #232e3c); }
  .status.ok { background:#1f3d2c; color:#7fde9b; }
  .status.err { background:#3d1f24; color:#ff7d8b; }
  .footer { margin-top:auto; padding-top:24px; font-size:12px; color: var(--tg-theme-hint-color, #93a3b3); text-align:center; }
  .footer a { color: var(--tg-theme-link-color, #2ea6ff); text-decoration:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎬 Tonton Iklan</h1>
  <div class="sub">Setiap iklan rewarded selesai = saldo bertambah otomatis.</div>

  <div class="balance-card">
    <div class="label">Saldo aktif</div>
    <div class="value" id="balance">Rp —</div>
    <div class="meta">
      <span>Reward / iklan: <b id="rate">Rp —</b></span>
      <span>Iklan ditonton: <b id="watched">—</b></span>
    </div>
  </div>

  <button id="btn" class="primary" disabled>Memuat…</button>
  <div id="status" class="status">Menyiapkan iklan…</div>

  <div class="footer">
    Powered by <span id="ad-provider">Adsgram</span> · v0.2 ·
    <a href="#" id="back">Tutup</a>
  </div>
</div>

<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (!tg) { document.getElementById('status').textContent = 'Buka lewat tombol Tonton Iklan di dalam bot.'; return; }
  tg.ready();
  tg.expand();

  const $ = (id) => document.getElementById(id);
  const fmtRp = (n) => 'Rp ' + Number(n||0).toLocaleString('id-ID');

  let cfg = null; // server-provided config (block_id, earn_per_ad, mock)
  let busy = false;

  const setStatus = (msg, kind) => {
    const el = $('status');
    el.textContent = msg;
    el.className = 'status' + (kind ? ' ' + kind : '');
  };
  const setBusy = (b, label) => {
    busy = b;
    const btn = $('btn');
    btn.disabled = b;
    if (label) btn.textContent = label;
  };

  async function api(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: {'content-type': 'application/json'},
      body: JSON.stringify({ initData: tg.initData, ...(body||{}) }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
    return data;
  }

  async function refresh() {
    const me = await api('/api/me');
    $('balance').textContent = fmtRp(me.balance);
    $('watched').textContent = me.ads_watched;
    $('rate').textContent = fmtRp(me.earn_per_ad);
    return me;
  }

  async function loadAdsgram(blockId) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://sad.adsgram.ai/js/sad.min.js';
      s.async = true;
      s.onload = () => {
        try {
          const adController = window.Adsgram.init({ blockId });
          resolve(adController);
        } catch (e) { reject(e); }
      };
      s.onerror = () => reject(new Error('Gagal load Adsgram SDK'));
      document.head.appendChild(s);
    });
  }

  async function bootstrap() {
    try {
      const c = await api('/api/config');
      cfg = c;
      if (c.mock || !c.adsgram_block_id) {
        $('ad-provider').textContent = 'Mock (testing)';
      }
      await refresh();
      $('btn').disabled = false;
      $('btn').textContent = '▶️ Tonton Iklan & Klaim ' + fmtRp(c.earn_per_ad);
      setStatus('Siap. Klik tombol untuk mulai.');
    } catch (e) {
      setStatus('Gagal mempersiapkan iklan: ' + e.message, 'err');
    }
  }

  let adController = null;

  async function watchAd() {
    if (busy) return;
    setBusy(true, 'Memuat iklan…');
    setStatus('Iklan dimuat…');

    try {
      if (cfg.adsgram_block_id) {
        if (!adController) adController = await loadAdsgram(cfg.adsgram_block_id);
        try {
          await adController.show();
          // user finished watching
        } catch (e) {
          throw new Error('Iklan tidak selesai ditonton');
        }
      } else {
        // mock: 2s simulated playback
        setStatus('▶️ Memutar iklan demo (2 detik)…');
        await new Promise(r => setTimeout(r, 2000));
      }

      setStatus('Klaim reward…');
      const r = await api('/api/claim_ad');
      $('balance').textContent = fmtRp(r.balance);
      $('watched').textContent = r.ads_watched;
      setStatus('🎉 +' + fmtRp(r.amount) + ' masuk! Saldo sekarang ' + fmtRp(r.balance), 'ok');
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('success');
    } catch (e) {
      setStatus('❌ ' + e.message, 'err');
      tg.HapticFeedback && tg.HapticFeedback.notificationOccurred('error');
    } finally {
      setBusy(false, '▶️ Tonton Iklan Lagi');
    }
  }

  $('btn').addEventListener('click', watchAd);
  $('back').addEventListener('click', (e) => { e.preventDefault(); tg.close(); });

  bootstrap();
})();
</script>
</body>
</html>
